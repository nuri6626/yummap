<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    window.onload = function() {
      var script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=9135b1f141c68a3e3aee32f5e5d81344&autoload=false';
      
      script.onload = function() {
        console.log('SDK 로드 성공!');
        kakao.maps.load(function() {
          console.log('맵 초기화 성공!');
          var container = document.getElementById('map');
          var options = {
            center: new kakao.maps.LatLng(37.4979, 127.0276),
            level: 5
          };
          new kakao.maps.Map(container, options);
        });
      };
      
      script.onerror = function(e) {
        console.error('SDK 로드 실패:', e);
        document.body.innerHTML = '<p style="padding:20px;color:red;">SDK 로드 실패! 콘솔 확인</p>';
      };
      
      document.head.appendChild(script);
    };
  </script>
</body>
</html>
